[package]
name = "vegan-monster-game"
version = "0.1.0"
edition = "2021"

[dependencies]
# Disable default features and only enable what we need
bevy = { version = "0.15", default-features = false, features = [
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_winit",
    "bevy_state",
    "multi_threaded",
    "png",
    "x11",      # X11 support (default)
] }
rand = "0.8"

[features]
default = []
wayland = ["bevy/wayland"]  # Enable Wayland support for Sway/Manjaro

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
